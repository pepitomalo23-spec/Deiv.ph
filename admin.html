<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- No debe salir en buscadores ni enlazarse desde ningún sitio público: se
     llega aquí solo escribiendo la URL o desde un marcador guardado. -->
<meta name="robots" content="noindex, nofollow">
<title>Acceso administrador · Deiv.ph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<!-- Reutiliza el mismo styles.css del sitio público: el formulario de abajo
     usa las clases .admin-login-* que ya existen ahí (antes vivían dentro
     de un overlay flotante en index.html; ahora esta página las muestra
     centradas a pantalla completa). -->
<link rel="stylesheet" href="styles.css?v=2">
<style>
  /* Estilos propios de esta página, solo para el encaje a pantalla
     completa: el resto (tarjeta, inputs, botones) ya viene de styles.css. */
  html, body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fafafa;
    padding:20px;
    box-sizing:border-box;
    font-family:'Fraunces','Georgia',serif;
  }
  .admin-standalone-card{
    width:100%;
    max-width:360px;
  }
  .admin-standalone-card .admin-login-card{
    animation:none;
    box-shadow:0 10px 40px rgba(0,0,0,0.10);
  }
  .admin-standalone-back{
    display:block;
    text-align:center;
    margin-top:18px;
    font-size:0.8rem;
    color:var(--dim, #777);
    text-decoration:none;
  }
  .admin-standalone-back:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="admin-standalone-card">
  <div class="admin-login-card">
    <p class="admin-login-title">Acceso de administrador</p>
    <p class="admin-login-sub">Inicia sesión con tu cuenta para entrar a Ajustes.</p>
    <p class="admin-login-error" id="adminLoginError">Correo o contraseña incorrectos.</p>
    <input type="text" id="adminLoginEmail" placeholder="Correo electrónico" autocomplete="username">
    <input type="password" id="adminLoginPass" placeholder="Contraseña" autocomplete="current-password">
    <div class="admin-login-actions">
      <button type="button" class="admin-login-primary" id="adminLoginSubmit" style="flex:1;">Entrar</button>
    </div>
    <p style="text-align:center;margin-top:14px;">
      <a href="#" id="adminLoginForgot" style="font-size:0.78rem;color:var(--dim);">¿Olvidaste tu contraseña?</a>
    </p>
  </div>
  <a href="index.html" class="admin-standalone-back">← Volver al sitio</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" crossorigin="anonymous"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cloud-db.js"></script>
<script src="js/admin-login.js"></script>

</body>
</html>
